
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Waste Prediction | FoodSave</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/user-info.css') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Food<span>Save</span></h2>
            </div>

            <nav>
                <a href="{{ url_for('dashboard') }}" class="nav-link">
                    Dashboard
                </a>

                <a href="{{ url_for('food_waste_prediction') }}"
                   class="nav-link active">
                    Food Waste Prediction
                </a>

                <a href="{{ url_for('donations_page') }}" class="nav-link">
                    Donations
                </a>

                <a href="{{ url_for('organizations_page') }}" class="nav-link">
                    Organizations
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-footer-divider"></div>

                <div class="sidebar-footer-content">
                    <div class="sidebar-footer-icon">🌱</div>

                    <div class="sidebar-footer-text">
                        <span>Food Waste Management System</span>
                    </div>
                </div>

                <p class="sidebar-footer-tagline">
                    Reducing waste. Supporting communities.
                </p>
            </div>

            <div class="sidebar-logout">
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </aside>



        <!-- Main Content -->
        <main class="main-content">

            <div id="user-info" class="user-info">
                <div class="user-avatar">
                    <span id="user-initial">U</span>
                </div>

                <div class="user-details">
                    <span id="user-name"></span>
                    <span id="user-role"></span>
                </div>
            </div>

            <header class="topbar">
                <h1>Food Waste Prediction</h1>
                <span>Admin</span>
            </header>

            <!-- Prediction Section -->
            <section class="prediction-section">

                <div class="section-header">
                    <h2>Food Waste Prediction</h2>
                    <p>Enter kitchen information to estimate food waste.</p>
                </div>

                <form id="prediction-form">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="meals_served">Meals Served</label>
                            <input type="number" id="meals_served"
                                   name="meals_served" min="1" required>
                        </div>

                        <div class="form-group">
                            <label for="kitchen_staff">Kitchen Staff</label>
                            <input type="number" id="kitchen_staff"
                                   name="kitchen_staff" min="1" required>
                        </div>

                        <div class="form-group">
                            <label for="temperature_c">Temperature (°C)</label>
                            <input type="number" id="temperature_c"
                                   name="temperature_c" step="any" required>
                        </div>

                        <div class="form-group">
                            <label for="humidity_percent">Humidity (%)</label>
                            <input type="number" id="humidity_percent"
                                   name="humidity_percent" min="0" max="100"
                                   step="any" required>
                        </div>

                        <div class="form-group">
                            <label for="day_of_week">Day of Week</label>
                            <select id="day_of_week" name="day_of_week" required>
                                <option value="">Select day</option>
                                <option value="0">Monday</option>
                                <option value="1">Tuesday</option>
                                <option value="2">Wednesday</option>
                                <option value="3">Thursday</option>
                                <option value="4">Friday</option>
                                <option value="5">Saturday</option>
                                <option value="6">Sunday</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="special_event">Special Event</label>
                            <select id="special_event" name="special_event" required>
                                <option value="">Select option</option>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="past_waste_kg">Past Waste (kg)</label>
                            <input type="number" id="past_waste_kg"
                                   name="past_waste_kg" min="0"
                                   step="any" required>
                        </div>

                        <div class="form-group">
                            <label for="staff_experience">Staff Experience</label>
                            <select id="staff_experience"
                                    name="staff_experience" required>
                                <option value="">Select experience</option>
                                <option value="beginner">Beginner</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="expert">Expert</option>
                                <option value="unknown">Unknown</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="waste_category">Waste Category</label>
                            <select id="waste_category"
                                    name="waste_category" required>
                                <option value="">Select category</option>
                                <option value="meat">Meat</option>
                                <option value="dairy">Dairy</option>
                                <option value="vegetables">Vegetables</option>
                                <option value="grains">Grains</option>
                            </select>
                        </div>

                    </div>

                    <button type="submit" id="predict-button">
                        Predict Food Waste
                    </button>

                </form>

                <!-- Prediction Result -->
                <div id="prediction-result" class="prediction-result">
                    <h3>Prediction Result</h3>
                    <p id="prediction-value">No prediction available yet.</p>
                </div>

            </section>

        </main>

    </div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/user-info.js') }}"></script>
<script src="{{ url_for('static', filename='js/prediction.js') }}"></script>

</body>
</html>
